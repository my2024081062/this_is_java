version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgresql-db
    environment:
      POSTGRES_USER: postgresql-lsh
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: postgresql
    ports:
      - "5432:5432"
    volumes:
      - ./postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local